<!-- To delete student data-->
<!DOCTYPE html>
<html>
<head>
    <title>Delete Student</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            text-align: center;
            color: #fff;
            position: relative;
            min-height: 100vh;
        }
        /* Background image with blur */
        body::before {
            content: "";
            background: url('school_background.png') no-repeat center center fixed;
            background-size: cover;
            filter: blur(6px);
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }
        h1 {
            color: #ffcc00;
            margin-top: 20px;
        }
        hr {
            border: 1px solid #ffcc00;
        }
        a {
            color: #00ffcc;
            text-decoration: none;
            margin: 0 10px;
            font-weight: bold;
            font-size: 18px;
            background-color: rgba(0,0,0,0.6);
            padding: 5px 10px;
            border-radius: 4px;
        }
        a:hover {
            color: #ff6699;
            background-color: rgba(255,255,255,0.2);
            box-shadow: 0 0 10px #ff6699;
        }
        select {
            padding: 10px;
            border-radius: 5px;
            border: none;
            font-size: 16px;
            margin: 10px;
            background-color: #222;
            color: #fff;
            width: 250px;
        }
        button {
            background-color: #ff6699;
            color: #fff;
            border: none;
            padding: 12px 25px;
            margin: 10px;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }
        button:hover {
            background-color: #00cc99;
            box-shadow: 0 0 12px #00cc99;
        }
    </style>
</head>
<body>
    <h1>DELETE STUDENT</h1>
    <hr>
    <a href="index.html">Home</a> |
    <a href="list.html">List Students</a> |
    <a href="listOne.html">List Required Student</a> |
    <a href="insert.html">Insert Student</a> |
    <a href="update.html">Update Student</a> |
    <a href="delete.html">Delete Student</a>
    <hr>

    Student Number to Delete:
    <select id="studentDropdown">
        <option value="">-- Select Student ID --</option>
    </select>
    <br><br>

    <button onclick="deleteStudent()">Delete</button>
    <br><br>
    <button onclick="location.href='index.html'">Home Page</button>

    <script>
        // Load dropdown with only student IDs
        async function loadStudents() {
            try {
                const response = await fetch("/students");
                const students = await response.json();

                const idDropdown = document.getElementById("studentDropdown");

                students.forEach(stu => {
                    let idOption = document.createElement("option");
                    idOption.value = stu.student_id;
                    idOption.textContent = stu.student_id; // only ID shown
                    idDropdown.appendChild(idOption);
                });
            } catch (error) {
                alert("Error loading students: " + error.message);
            }
        }

        function deleteStudent() {
            let sno = document.getElementById("studentDropdown").value;

            if (!sno) {
                alert("Please select a student ID.");
                return;
            }

            if (confirm("Are you sure you want to delete this student?") == false)
                return;

            fetch("/students/" + sno, {
                method: "DELETE"
            })
            .then(response => {
                if (response.ok) return response.text();
                return response.text().then(message => { throw new Error(message); });
            })
            .then(message => {
                alert(message);
                location.href = "index.html";
            })
            .catch(error => {
                alert(error.message);
            });
        }

        // Load students when page opens
        window.onload = loadStudents;
    </script>
</body>
</html>
