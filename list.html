<!DOCTYPE html>
<html>
<head>
    <title>List Students</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            text-align: center;
            color: #fff;
            position: relative;
            min-height: 100vh;
        }
        /* Background image with blur */
        body::before {
            content: "";
            background: url('school_background.png') no-repeat center center fixed;
            background-size: cover;
            filter: blur(6px);
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }
        h1 {
            color: #ffcc00;
            margin-top: 20px;
        }
        hr {
            border: 1px solid #ffcc00;
        }
        a {
            color: #00ffcc;
            text-decoration: none;
            margin: 0 10px;
            font-weight: bold;
            font-size: 18px;
            background-color: rgba(0,0,0,0.6);
            padding: 5px 10px;
            border-radius: 4px;
        }
        a:hover {
            color: #ff6699;
            background-color: rgba(255,255,255,0.2);
            box-shadow: 0 0 10px #ff6699;
        }
        button {
            background-color: #ff6699;
            color: #fff;
            border: none;
            padding: 12px 25px;
            margin: 10px;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }
        button:hover {
            background-color: #00cc99;
            box-shadow: 0 0 12px #00cc99;
        }
        table {
            margin: 20px auto;
            border-collapse: collapse;
            width: 80%;
            background-color: rgba(0,0,0,0.6);
            color: #fff;
        }
        th, td {
            border: 1px solid #ffcc00;
            padding: 10px;
            text-align: center;
        }
        th {
            background-color: #333;
            color: #ffcc00;
        }
        tr:hover {
            background-color: rgba(255,255,255,0.1);
        }
    </style>
</head>
<body>
    <h1>LIST OF STUDENTS</h1>
    <hr>
    <a href="index.html">Home</a> |
    <a href="list.html">List Students</a> |
    <a href="listOne.html">List Required Student</a> |
    <a href="insert.html">Insert Student</a> |
    <a href="update.html">Update Student</a> |
    <a href="delete.html">Delete Student</a>
    <hr>

    <button onclick="loadStudents()">Refresh List</button>
    <br><br>

    <table id="studentTable"></table>
    <br>
    <button onclick="location.href='index.html'">Home Page</button>

    <script>
        loadStudents();
        function loadStudents() {
            fetch("/students")
            .then(response => response.json())
            .then(data => {
                let table = document.getElementById("studentTable");
                table.innerHTML = `
                <tr>
                    <th>Student Number</th>
                    <th>Name</th>
                    <th>Total</th>
                </tr>`;
                data.forEach(student => {
                    table.innerHTML += `
                    <tr>
                        <td>${student.student_id}</td>
                        <td>${student.student_name}</td>
                        <td>${student.total}</td>
                    </tr>`;
                });
            });
        }
    </script>
</body>
</html>
